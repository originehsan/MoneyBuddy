name: moneybuddy
description: "MoneyBuddy — Your money's best friend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Icons ─────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # ── Animations ─────────────────────────────────────
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  animated_digit: ^3.1.1
  lottie: ^3.1.0
  confetti: ^0.7.0

  # ── Charts ─────────────────────────────────────────
  fl_chart: 0.69.0

  # ── State + Navigation ─────────────────────────────
  get: ^4.7.2

  # ── Firebase ───────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # ── AI / ML ────────────────────────────────────────
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.11.0

  # ── Storage ────────────────────────────────────────
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # ── Auth ───────────────────────────────────────────
  local_auth: ^2.3.0
  pinput: ^6.0.2

  # ── UX ─────────────────────────────────────────────
  flutter_slidable: ^4.0.3

  # ── Formatting ─────────────────────────────────────
  intl: ^0.20.1
  board_datetime_picker: ^2.1.6

  # ── Export ─────────────────────────────────────────
  share_plus: ^13.1.0
  path_provider: ^2.1.4

  # ── Calculator ─────────────────────────────────────
  math_expressions: ^3.1.0

  # ── Notifications ──────────────────────────────────
  flutter_local_notifications: ^20.1.0

  # ── Layout ─────────────────────────────────────────
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/background/
    - assets/images/icons/
    - assets/lottie/